[package]
name = "wabridge-desktop"
version = "0.1.0"
description = "WaBridge — free Android to iPhone WhatsApp migration"
authors = ["Parvesh Kumar"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "wabridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
