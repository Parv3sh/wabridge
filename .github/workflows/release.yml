# Builds signed-free installers for macOS (Apple silicon + Intel), Windows and Linux whenever a
# tag like v0.2.0 is pushed, and attaches them to a draft GitHub release.
name: Release desktop app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon
            triple: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-15-intel    # Intel (macos-13 was retired by GitHub in Dec 2025)
            triple: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine + PyInstaller
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -q -e ".[ios]" pyinstaller
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Freeze the Python engine (sidecar)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh gui/scripts/build-sidecar.ps1
          else
            sh gui/scripts/build-sidecar.sh ${{ matrix.triple }}
          fi

      - name: Frontend dependencies
        run: npm install --no-fund --no-audit
        working-directory: gui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          # Only a pushed tag publishes a release; a manual run just builds the installers as artifacts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('WaBridge {0}', github.ref_name) || '' }}
          releaseBody: "Unsigned builds. macOS blocks the first launch: open System Settings › Privacy & Security and click Open Anyway, or run `xattr -dr com.apple.quarantine /Applications/WaBridge.app`. See the README for what is verified on real devices."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
